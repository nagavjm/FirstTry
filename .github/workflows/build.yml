# =============================================================================
# BUILD WORKFLOW - CI Pipeline for Feature Branches & Pull Requests
# =============================================================================
# Triggers:
#   - Push to feature/* branches
#   - Pull requests to main/master branch
# Purpose:
#   - Validate build integrity
#   - Run tests
#   - Block merge if build fails
# =============================================================================

name: Build & Validate

on:
  push:
    branches:
      - 'feature/**'
      - 'feature/*'
      - 'bugfix/**'
      - 'bugfix/*'
      - 'hotfix/**'
      - 'hotfix/*'
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '18'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ===========================================================================
  # JOB: Build Backend (.NET Core 8)
  # ===========================================================================
  build-backend:
    name: 🔧 Build Backend (.NET 8)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Backend

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 📥 Restore dependencies
      run: dotnet restore --locked-mode
      continue-on-error: true

    - name: 📥 Restore dependencies (fallback)
      if: failure()
      run: dotnet restore

    - name: 🏗️ Build
      run: dotnet build --configuration Release --no-restore

    - name: 🧪 Run Unit Tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults
      continue-on-error: false

    - name: 📊 Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: Backend/TestResults
        retention-days: 7

  # ===========================================================================
  # JOB: Build Frontend (Angular)
  # ===========================================================================
  build-frontend:
    name: 🎨 Build Frontend (Angular)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔍 Lint
      run: npm run lint --if-present
      continue-on-error: true

    - name: 🏗️ Build (Production)
      run: npm run build -- --configuration=production

    - name: 🧪 Run Unit Tests
      run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage
      continue-on-error: true

    - name: 📊 Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-coverage
        path: Frontend/coverage
        retention-days: 7

  # ===========================================================================
  # JOB: Build Validation Complete
  # ===========================================================================
  build-validation:
    name: ✅ Build Validation
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()

    steps:
    - name: 🔍 Check Build Status
      run: |
        if [ "${{ needs.build-backend.result }}" != "success" ] || [ "${{ needs.build-frontend.result }}" != "success" ]; then
          echo "❌ Build validation failed!"
          echo "Backend: ${{ needs.build-backend.result }}"
          echo "Frontend: ${{ needs.build-frontend.result }}"
          exit 1
        fi
        echo "✅ All builds completed successfully!"

    - name: 📝 Build Summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Backend (.NET 8) | ${{ needs.build-backend.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend (Angular) | ${{ needs.build-frontend.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

